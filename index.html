<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Dashboard | 多機能デジタル時計</title>
    <meta name="description" content="Web上でタイマー付きの大きなデジタル時計を表示し、役に立つ情報も一目で確認できる多機能ダッシュボード。" />
    <meta property="og:title" content="Campus Dashboard | 多機能デジタル時計" />
    <meta property="og:description" content="Web上でタイマー付きの大きなデジタル時計を表示し、役に立つ情報も一目で確認できる多機能ダッシュボード。" />
    <meta property="og:image" content="https://cpd.cnion.dev/ogp.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#42b3f5" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa/apple-touch-icon@192px.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=M+PLUS+Rounded+1c:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 読み込み中の画面 (JSの読み込み前から表示するため、ここで定義。LoadingScreen.tsxと共通) -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--color-base-100, #ffffff);
        color: var(--color-base-content, #1f2937);
        font-family: 'Inter', 'M PLUS Rounded 1c', sans-serif;
        transition: opacity 0.4s ease;
      }

      .splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      .splash img {
        width: 96px;
        height: 96px;
      }

      .splash-title {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .splash-spinner {
        width: 2rem;
        height: 2rem;
        border: 4px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: splash-spin 0.8s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="読み込み中">
        <img src="%BASE_URL%icon.svg" alt="" />
        <span class="splash-title">Campus Dashboard</span>
        <span class="splash-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
